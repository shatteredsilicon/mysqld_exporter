# SSM Prometheus mysqld_exporter

description    "SSM Prometheus mysqld_exporter"

start on stopped rc RUNLEVEL=[2345]
stop on runlevel [!2345]

respawn
respawn limit 10 5
umask 022

setuid ssm
setgid ssm

console none

pre-start script
    [ -f /var/log/ssm-mysql-metrics.log ] && chown ssm:ssm /var/log/ssm-mysql-metrics.log
    test -x /opt/ss/ssm-client/mysqld_exporter || { stop; exit 0; }
end script

# Start
exec /opt/ss/ssm-client/mysqld_exporter >> /var/log/ssm-mysql-metrics.log 2>&1